name: release-1-1-0

# 一次性工作流：把 1.1.0 的三个 tag 建好、打完包、发 release。
# 用 Actions 自带的 GITHUB_TOKEN（contents: write），不需要本地 PAT。

on:
  push:
    branches:
      - chore/release-1.1.0
  workflow_dispatch:

permissions:
  contents: write

env:
  DSHA: e247e55e7e8e107eacf38b3717af4932236f39db
  SSHA: 8d16283839f0adc85647dc829fe8d43c26116b6e
  OUT: ${{ runner.temp }}/out

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stash helper
        run: |
          mkdir -p "$OUT"
          cp tools/wb_notes.py "$RUNNER_TEMP/notes.py"

      - name: Create tags
        run: |
          set -euo pipefail
          git tag -f douban-wish-v1.1.0 "$DSHA"
          git tag -f douban-hot-subscribe-v1.1.0 "$DSHA"
          git tag -f seed-scheduler-v1.1.0 "$SSHA"
          git push -f origin douban-wish-v1.1.0 douban-hot-subscribe-v1.1.0 seed-scheduler-v1.1.0

      - name: Pack at each tag target
        run: |
          set -euo pipefail
          pack_one() {
            id="$1"
            f="$OUT/$id-1.1.0.mcplugin"
            python3 scripts/pack.py "plugins/$id" --output "$f"
            printf '%s\r\n' "$(sha256sum "$f" | cut -d' ' -f1)" > "$f.sha256"
            python3 "$RUNNER_TEMP/notes.py" "plugins/$id/CHANGELOG.md" > "$OUT/$id-1.1.0.md"
          }
          git checkout "$DSHA"
          pack_one douban-wish
          pack_one douban-hot-subscribe
          git checkout "$SSHA"
          pack_one seed-scheduler

      - name: Publish releases
        run: |
          set -euo pipefail
          for id in douban-wish douban-hot-subscribe seed-scheduler; do
            f="$OUT/$id-1.1.0.mcplugin"
            if gh release view "$id-v1.1.0" >/dev/null 2>&1; then
              gh release upload "$id-v1.1.0" "$f" "$f.sha256" --clobber
            else
              gh release create "$id-v1.1.0" "$f" "$f.sha256" \
                --title "$id 1.1.0" \
                --notes-file "$OUT/$id-1.1.0.md" \
                --latest=false
            fi
          done
